name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup component add rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  test:
    name: Test (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.test
          load: true
          tags: mapecd-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Run unit tests
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            -v "$HOME/.cargo/git:/usr/local/cargo/git" \
            -w /workspace \
            mapecd-test:latest \
            cargo test --lib

      - name: Run integration tests
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/workspace" \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            -v "$HOME/.cargo/git:/usr/local/cargo/git" \
            -w /workspace \
            mapecd-test:latest \
            cargo test --test '*_integration' -- --nocapture --test-threads=1

  package:
    name: Build deb package
    runs-on: ubuntu-latest
    needs: [fmt, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Cache cargo bin (bpf-linker, cargo-deb)
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bin-bpf-linker-cargo-deb-v1

      - name: Install bpf-linker
        run: which bpf-linker || cargo install bpf-linker

      - name: Install cargo-deb
        run: which cargo-deb || cargo install cargo-deb

      - name: Build release binary
        run: cargo build --release

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build .deb package
        run: cargo deb --no-build

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapecd-${{ github.sha }}-amd64.deb
          path: target/debian/*.deb
          retention-days: 30
